<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in — Mobile 2, social up top</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/tutorpal/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
input::placeholder{color:#61718a}
a{color:#533afd}a:hover{color:#4434d4}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 24px 28px; display: flex; flex-direction: column; background: {{ground}}; font-family: var(--font-sans); font-feature-settings: 'ss01'; color: var(--foreground); overflow: hidden">
  <div style="display: flex; flex-direction: column; gap: 28px">
    <img src="/_blob/8644055e0b4d2ecc97b0f653c52bb47b" alt="TutorPal" style="width: 44px; height: 44px; border-radius: 12px">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <h1 style="margin: 0; font-size: 36px; line-height: 1.05; font-weight: 300; letter-spacing: -0.02em">Welcome back</h1>
      <p style="margin: 0; font-size: 15px; line-height: 22px; color: var(--muted-foreground)">Sign in to continue managing your students and classes.</p>
    </div>
  </div>

  <div style="flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; gap: 20px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button type="button" style="height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--input-hover); border-radius: 9999px; background: var(--card); color: var(--foreground); font-family: inherit; font-size: 15px; font-weight: 500"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"></path><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"></path><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"></path><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"></path></svg>Google</button>
      <button type="button" style="height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--input-hover); border-radius: 9999px; background: var(--card); color: var(--foreground); font-family: inherit; font-size: 15px; font-weight: 500"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#06C755"></rect><path fill="#fff" d="M12 5.5c-4.1 0-7.5 2.7-7.5 6 0 3 2.6 5.4 6.2 5.9.2 0 .6.2.6.4l.1.9c0 .3-.2 1 .9.5s5.6-3.3 7.1-5.6c.7-.9 1.1-1.9 1.1-2.9 0-3.3-3.4-6-7.5-6z"></path></svg>LINE</button>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted-foreground)">
      <div style="height: 1px; flex: 1; background: var(--border)"></div>
      <span>or with email</span>
      <div style="height: 1px; flex: 1; background: var(--border)"></div>
    </div>
    <form style="display: flex; flex-direction: column; gap: 12px">
      <label for="m2-email" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Email</label>
      <div style="position: relative">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#61718a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 14px; top: 18px"><rect x="2" y="4" width="20" height="16" rx="3"></rect><path d="m3 7 7.6 5.2a2.5 2.5 0 0 0 2.8 0L21 7"></path></svg>
        <input id="m2-email" type="email" placeholder="Email" style="width: 100%; box-sizing: border-box; height: 52px; padding: 0 14px 0 38px; border: 1px solid var(--input-hover); border-radius: 6.4px; background: var(--card); font-family: inherit; font-size: 16px; color: var(--foreground)">
      </div>
      <label for="m2-pass" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Password</label>
      <div style="position: relative">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#61718a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 14px; top: 18px"><rect x="4" y="10" width="16" height="11" rx="3"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
        <input id="m2-pass" type="password" placeholder="Password" style="width: 100%; box-sizing: border-box; height: 52px; padding: 0 48px 0 38px; border: 1px solid var(--input-hover); border-radius: 6.4px; background: var(--card); font-family: inherit; font-size: 16px; color: var(--foreground)">
        <button type="button" aria-label="Show password" style="position: absolute; right: 4px; top: 4px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#61718a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
      </div>
      <a href="#" style="align-self: flex-end; display: inline-flex; align-items: center; height: 32px; font-size: 14px; font-weight: 600; text-decoration: none">Forgot password?</a>
    </form>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px">
    <p style="margin: 0; font-size: 13px; line-height: 19px; color: var(--muted-foreground)">By continuing, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</p>
    <button type="submit" style="height: 52px; border: 0; border-radius: 9999px; background: var(--primary); color: var(--primary-foreground); font-family: inherit; font-size: 15px; font-weight: 500">Sign in</button>
    <p style="margin: 0; text-align: center; font-size: 14px; color: var(--muted-foreground)">Don't have an account? <a href="#" style="font-weight: 600; text-decoration: none">Create account</a></p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ground":{"editor":"color","default":"#f6f9fc","options":["#f6f9fc","#ffffff"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { ground: this.props.ground ?? '#f6f9fc' };
  }
}
</script>
</body>
</html>
