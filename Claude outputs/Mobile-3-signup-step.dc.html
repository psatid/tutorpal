<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create account — Mobile, name step</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/tutorpal/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
input::placeholder{color:#61718a}
a{color:#533afd}a:hover{color:#4434d4}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 24px 28px; display: flex; flex-direction: column; background: {{ground}}; font-family: var(--font-sans); font-feature-settings: 'ss01'; color: var(--foreground); overflow: hidden">
  <div style="display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <img src="/_blob/8644055e0b4d2ecc97b0f653c52bb47b" alt="TutorPal" style="width: 44px; height: 44px; border-radius: 12px">
      <a href="#" style="display: inline-flex; align-items: center; height: 44px; padding: 0 4px; font-size: 15px; font-weight: 500; color: var(--secondary-foreground); text-decoration: none">Sign in</a>
    </div>
    <div role="progressbar" aria-valuemin="1" aria-valuemax="3" aria-valuenow="1" aria-label="Signup progress: step 1 of 3" style="display: flex; gap: 6px">
      <div style="height: 4px; flex: 1; border-radius: 9999px; background: var(--primary)"></div>
      <div style="height: 4px; flex: 1; border-radius: 9999px; background: var(--input)"></div>
      <div style="height: 4px; flex: 1; border-radius: 9999px; background: var(--input)"></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 12px">
      <h1 style="margin: 0; font-size: 36px; line-height: 1.1; font-weight: 300; letter-spacing: -0.02em">Create your account<br><span style="color: var(--muted-foreground)">What's your name?</span></h1>
      <p style="margin: 0; font-size: 15px; line-height: 22px; color: var(--muted-foreground)">We'll use this to personalize your workspace.</p>
    </div>
  </div>

  <form style="flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center">
    <label for="m3-name" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Name</label>
    <div style="position: relative">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#61718a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 16px; top: 19px"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
      <input id="m3-name" type="text" placeholder="Your full name" style="width: 100%; box-sizing: border-box; height: 56px; padding: 0 16px 0 44px; border: 1px solid var(--input-hover); border-radius: 6.4px; background: var(--card); font-family: inherit; font-size: 17px; color: var(--foreground)">
    </div>
  </form>

  <div style="display: flex; flex-direction: column; gap: 14px">
    <p style="margin: 0; font-size: 13px; line-height: 19px; color: var(--muted-foreground)">By continuing, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</p>
    <button type="submit" style="height: 52px; border: 0; border-radius: 9999px; background: var(--primary); color: var(--primary-foreground); font-family: inherit; font-size: 15px; font-weight: 500">Continue</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ground":{"editor":"color","default":"#f6f9fc","options":["#f6f9fc","#ffffff"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { ground: this.props.ground ?? '#f6f9fc' };
  }
}
</script>
</body>
</html>
