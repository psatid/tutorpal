    - component:
        name: backend
      cors:
        allow_credentials: true
        allow_headers:
          - Content-Type
        allow_methods:
          - GET
          - HEAD
          - POST
          - OPTIONS
          - PUT
          - PATCH
          - DELETE
        allow_origins:
          - exact: https://dev.tutorpal.io
      match:
        path:
          prefix: /
