domains:
  - domain: dev.api.tutorpal.io
    type: PRIMARY
    zone: tutorpal.io
features:
  - buildpack-stack=ubuntu-22
ingress:
  rules:
    - component:
        name: backend
      cors:
        allow_credentials: true
        allow_headers:
          - Content-Type
        allow_methods:
          - GET
          - HEAD
          - POST
          - OPTIONS
          - PUT
          - PATCH
          - DELETE
        allow_origins:
          - exact: https://dev.tutorpal.io
      match:
        path:
          prefix: /
name: tutor-pal-backend-dev
region: sgp
services:
  - envs:
      - key: PORT
        scope: RUN_AND_BUILD_TIME
        value: "3000"
      - key: CORS_ORIGIN
        scope: RUN_AND_BUILD_TIME
        value: https://dev.tutorpal.io
