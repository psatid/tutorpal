alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
domains:
  - domain: dev.tutorpal.io
    type: PRIMARY
    zone: tutorpal.io
features:
  - buildpack-stack=ubuntu-22
ingress:
  rules:
    - component:
        name: react
      match:
        path:
          prefix: /
name: tutorpal-app-dev
region: sgp
static_sites:
  - build_command: bun run generate:api && bun run build --mode dev
    catchall_document: index.html
    environment_slug: bun
    github:
      branch: main
      repo: psatid/tutorpal
      deploy_on_push: true
    name: react
    source_dir: frontend
